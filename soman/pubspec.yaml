name: soman
description: "Soman: aprende Lengua de Señas Colombiana con Nua."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  confetti: ^0.8.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  shared_preferences: ^2.5.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/models/
    - assets/images/
    - assets/videos/
    - assets/golden/

  # Fraunces and Jost are variable fonts: set weight and optical size with
  # TextStyle.fontVariations (wght, opsz), see lib/app/theme/soman_type.dart.
  fonts:
    - family: RegularAesthetic
      fonts:
        - asset: assets/fonts/RegularAesthetic.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost.ttf
